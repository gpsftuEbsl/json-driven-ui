<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>早療情境互動遊戲</title>
    <style>
        body {
            font-family: 'Segoe UI', Microsoft JhengHei, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
        }

        #scene-image {
            max-width: 100%;
            height: auto;
            max-height: 250px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            display: none;
            opacity: 0;
            /* 預設先隱藏，載入完再淡入 */
            transition: opacity 0.4s ease-in-out;
        }

        h1 {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            color: #2c3e50;
            line-height: 1.6;
            white-space: pre-wrap;
            /* 讓換行符號生效 */
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            color: white;
            width: 100%;
        }

        #btn1 {
            background-color: rgb(75, 163, 119);
        }

        #btn2 {
            background-color: rgb(82, 119, 171);
        }

        .title-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 15px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 2rem;
        }

        /* 故事對話框造型 */
        .speech-bubble {
            position: relative;
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 3px solid #cbd5e1;
            /* 圓潤的邊框 */
            margin: 0;
            flex: 1;
            text-align: left;
            font-size: 1.2rem;
            color: #334155;
            line-height: 1.6;
            white-space: pre-wrap;
            font-weight: bold;
            /* 讓字體再粗一點更像童書 */
        }

        /* 下方的小尖角 (白底) */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 12px 12px 0;
            border-style: solid;
            border-color: #ffffff transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 1;
        }

        /* 下方的小尖角 (邊框) */
        .speech-bubble::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 15px 15px 0;
            border-style: solid;
            border-color: #cbd5e1 transparent transparent transparent;
            display: block;
            width: 0;
            z-index: 0;
        }

        #speakBtn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            padding: 0;
            background-color: #f39c12;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        button:disabled {
            background-color: #ccc !important;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 轉圈圈動畫 CSS */
        .loader {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 4px solid rgba(44, 62, 80, 0.2);
            border-radius: 50%;
            border-top-color: #f39c12;
            /* 橘黃色，搭配你的按鈕 */
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 免責聲明 CSS */
        .disclaimer {
            margin-top: 30px;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.04);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #7f8c8d;
            line-height: 1.5;
            border-left: 4px solid #f39c12;
            max-width: 320px;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="title-container">
        <h1 id="title" class="speech-bubble"><span class="loader"></span> 故事加載中...</h1>
        <button id="speakBtn" style="display:none;" title="唸故事給我聽">🔊</button>
    </div>

    <img id="scene-image" src="./image/running.png" alt="情境圖片">

    <div class="btn-container">
        <button id="btn1" style="display:none;">選項一</button>
        <button id="btn2" style="display:none;">選項二</button>
    </div>

    <div class="disclaimer">
        ⚠️ <strong>免責聲明：</strong> 本互動遊戲產生之故事與情境僅供演練參考，無法取代專業醫療診斷。若孩童出現持續性行為問題或遇緊急狀況，請務必尋求專業兒心科醫師或治療師協助。
    </div>

    <script>
        let chooseRight = 0; //記錄當下是否對
        let rightNum = 0; //紀錄答對題數
        let Num = 0; //紀錄當前題數
        // === 圖片預載清單 (把常用的先載入) ===
        const PRELOAD_IMAGES = [
            'sharing.png', 'hugging.png', 'bad_end_crying.png', 'bad_end_time_out.png',
            'neutral.png', 'running.png', 'breathing.png'
        ];
        function preloadImages() {
            PRELOAD_IMAGES.forEach(file => {
                const img = new Image();
                img.src = `./image/${file}`;
            });
        }

        // === 配置區 ===
        // 🚨 這裡填寫你的 ngrok 網址，結尾不要加斜線
        const WEBHOOK_URL = `https://uncontrasting-interalar-jon.ngrok-free.dev/webhook/api/choice`;
        const GET_GAME_API = `https://uncontrasting-interalar-jon.ngrok-free.dev/webhook/get_game`;

        const urlParams = new URLSearchParams(window.location.search);
        const btn1El = document.getElementById('btn1');
        const btn2El = document.getElementById('btn2');
        const titleEl = document.getElementById('title');
        const speakBtn = document.getElementById('speakBtn');

        // 預先載入系統可用的聲音清單
        let availableVoices = [];
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                availableVoices = window.speechSynthesis.getVoices();
            };
        }

        // === 語音朗讀功能 (Web Speech API) ===
        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止之前的語音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';

                // 讓聲音稍微放慢、調高音調，聽起來比較年輕溫柔
                utterance.rate = 0.95;
                utterance.pitch = 1.3;

                // 嘗試從裝置中挑選「比較好聽的女性聲音」 (因不同手機/電腦而異)
                if (availableVoices.length === 0) {
                    availableVoices = window.speechSynthesis.getVoices();
                }

                const gentleVoice = availableVoices.find(v =>
                    v.lang.includes('zh') &&
                    (v.name.includes('Yating') || v.name.includes('Mei-Jia') || v.name.includes('Xiaoxiao') || v.name.includes('Google 國語'))
                ) || availableVoices.find(v => v.lang.includes('zh-TW'));

                if (gentleVoice) {
                    utterance.voice = gentleVoice;
                }

                window.speechSynthesis.speak(utterance);
            }
        }

        // 更新 UI 的共用函數
        function updateUI(text, b1, b2, scene) {
            if (text) {
                // 將測試文字註解掉，只顯示純故事
                // titleEl.innerText = text + "(測試scene裡面是" + scene + ")" + "這是第幾題:" + Num;
                titleEl.innerText = text;

                // 顯示並綁定朗讀按鈕
                speakBtn.style.display = 'flex';
                speakBtn.onclick = () => speakText(text);

                // 嘗試自動朗讀 (若是玩家點擊選項後觸發，通常會成功)
                speakText(text);
            }
            // 處理圖片
            const imgEl = document.getElementById('scene-image');
            if (scene) {
                // 圖片先透明，等載入完再顯示，避免與文字落差太大
                imgEl.style.opacity = 0;
                imgEl.onload = () => {
                    imgEl.style.opacity = 1;
                };
                imgEl.src = `./image/${scene}`;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }

            // 處理按鈕 1
            if (b1) {
                btn1El.innerText = b1;
                btn1El.style.display = "block";
            } else {
                btn1El.style.display = "none";
            }

            // 處理按鈕 2
            if (b2) {
                btn2El.innerText = b2;
                btn2El.style.display = "block";
            } else {
                btn2El.style.display = "none";
            }

            // 解除禁用
            btn1El.disabled = false;
            btn2El.disabled = false;
        }

        // === 核心功能：憑 ID 去後端拿劇本 ===
        async function initGame() {
            const gameId = urlParams.get('id');

            if (!gameId) {
                // 如果沒帶 ID，嘗試相容舊版的 text 參數，如果都沒帶就顯示錯誤
                const legacyText = urlParams.get('text');
                if (legacyText) {
                    updateUI(legacyText, urlParams.get('b1'), urlParams.get('b2'), urlParams.get('scene'));
                } else {
                    titleEl.innerText = "找不到遊戲編號，請從 LINE 重新進入。";
                    //以下兩行測試圖片是否顯示
                    const img = document.getElementById('scene-image');
                    img.style.display = "block";
                }
                return;
            }

            try {
                const response = await fetch(`${GET_GAME_API}?id=${gameId}`, {
                    method: "GET",
                    headers: {
                        "ngrok-skip-browser-warning": "69420",
                        "x-api-key": "early-intervention-2026-secret"
                    }
                });

                if (!response.ok) throw new Error("劇本載入失敗");

                const data = await response.json();
                updateUI(data.text, data.b1, data.b2, data.scene);
            } catch (error) {
                console.error("Fetch Error:", error);
                titleEl.innerText = "無法連線至後端大腦，請確認伺服器已啟動。";
                //以下兩行測試圖片是否顯示
                const img = document.getElementById('scene-image');
                img.style.display = "block";
            }
        }

        // === 送出玩家選擇 ===
        async function sendChoice(choiceText, IsLast) {
            btn1El.disabled = true;
            btn2El.disabled = true;
            titleEl.innerHTML = '<span class="loader"></span> 故事加載中...';

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "ngrok-skip-browser-warning": "69420"
                    },
                    body: JSON.stringify({
                        choice: choiceText,
                        userId: urlParams.get('uid')
                    })
                });

                const data = await response.json();
                // n8n 回傳新劇情，立刻更新畫面
                if (IsLast) {
                    result();
                } else {
                    updateUI(data.text, data.b1, data.b2, data.scene);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("網路連線出錯了，請重試！");
                btn1El.disabled = false;
                btn2El.disabled = false;
            }
        }
        //結束畫面
        async function result() {
            btn1El.style.display = "none";
            btn2El.style.display = "none";
            //等一下要傳到n8n，所以先把值傳回去
            fetch(WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "ngrok-skip-browser-warning": "69420"
                },
                body: JSON.stringify({
                    choice: rightNum,
                    userId: urlParams.get('uid')
                })
            });

            // 計算星星：亮的星星代表答對題數，暗的代表答錯
            const totalStars = 5;
            const stars = "⭐".repeat(rightNum) + "☆".repeat(Math.max(0, totalStars - rightNum));
            
            // 放大字體並顯示結果
            titleEl.style.fontSize = "1.6rem";
            titleEl.style.textAlign = "center";
            titleEl.innerHTML = `<div style="margin-bottom:10px;">${stars}</div>恭喜您完成了 ${Num} 題<br>答對了 ${rightNum} 題！`;
        }
        function flashImage() {
            img.src = ".image/rightAnswerForFront.png";
            titleEl.innerText = "很棒喔~";
            // 定義動畫關鍵影格 (Keyframes)
            const keyframes = [
                { opacity: 1 },   // 開始
                { opacity: 0 },   // 中間 (隱藏)
                { opacity: 1 }    // 結束
            ];
            // 定義動畫設定
            const options = {
                duration: 1500,    // 持續 1.5 秒
                iterations: 1,    // 閃一次
                easing: 'ease-in-out'
            };
            // 執行動畫
            imgEl.animate(keyframes, options);
        }
        // 綁定事件
        btn1El.addEventListener('click', () => {
            chooseRight = 1;
            rightNum++;
            Num++;
            //flashImage();
            if (Num <= 4) {
                sendChoice(btn1El.innerText, 0);
            } else {
                sendChoice(btn1El.innerText, 1);
            }
        });
        btn2El.addEventListener('click', () => {
            chooseRight = 0;
            Num++;
            if (Num <= 4) {
                sendChoice(btn2El.innerText, 0);
            } else {
                sendChoice(btn2El.innerText, 1);
            }
        });

        // 頁面載入後自動啟動
        window.onload = () => {
            initGame();
            preloadImages(); // 啟動預載
        };
    </script>
</body>

</html>
